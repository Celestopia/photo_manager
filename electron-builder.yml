appId: com.photomanager.desktop
productName: Photo Manager

directories:
  buildResources: build
  output: release

files:
  - package.json
  - build/icon.ico
  - dist/renderer/**/*
  - src/main/**/*
  - src/shared/**/*
  - scripts/**/*

asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

extraResources:
  - from: tools/ffmpeg/bin
    to: tools/ffmpeg/bin
    filter:
      - "*.exe"

win:
  executableName: ptmgr-gui
  target:
    - target: dir
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
